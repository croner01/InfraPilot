# 示例 Secret：生产环境请通过 Vault、Sealed Secrets 管理，不要在此文件中提交真实密钥。
#
# 注意：该 secret 必须与主 server（infrapilot-server）注入的 MCP_JWT_SECRET 一致 ——
# 主 server 用它签发短期 JWT，Agent 用同一密钥校验（HS256, aud=infrapilot-mcp）。
apiVersion: v1
kind: Secret
metadata:
  name: mcp-jwt-secret
  namespace: infrapilot-mcp
type: Opaque
stringData:
  secret: "change-this-to-a-random-secret-in-production"
