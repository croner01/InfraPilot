# DaemonSet：在每个节点上部署一个 linux-mcp-server Agent。
# 默认使用 insecure gRPC，便于 sandbox/开发环境快速验证；
# 生产环境请挂载 mTLS secret 并配置 MCP_SERVER_CA_PATH / MCP_SERVER_CERT_PATH / MCP_SERVER_KEY_PATH。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linux-mcp-server
  namespace: infrapilot-mcp
  labels:
    app: linux-mcp-server
spec:
  selector:
    matchLabels:
      app: linux-mcp-server
  template:
    metadata:
      labels:
        app: linux-mcp-server
    spec:
      serviceAccountName: linux-mcp-server
      hostPID: true
      hostNetwork: true
      containers:
        - name: linux-mcp-server
          image: infrapilot/linux-mcp-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_SERVER_MODE
              value: "true"
            - name: MCP_SERVER_PORT
              value: "8443"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-jwt-secret
                  key: secret
            # 生产启用 mTLS 时取消下面注释并挂载相应 secret
            # - name: MCP_SERVER_CA_PATH
            #   value: /etc/mcp/tls/ca.crt
            # - name: MCP_SERVER_CERT_PATH
            #   value: /etc/mcp/tls/server.crt
            # - name: MCP_SERVER_KEY_PATH
            #   value: /etc/mcp/tls/server.key
          ports:
            - name: grpc
              containerPort: 8443
              hostPort: 8443
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: run-systemd
              mountPath: /run/systemd
            # 生产 mTLS 时挂载证书卷
            # - name: mcp-tls
            #   mountPath: /etc/mcp/tls
            #   readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: varlog
          hostPath:
            path: /var/log
        - name: run-systemd
          hostPath:
            path: /run/systemd
        # - name: mcp-tls
        #   secret:
        #     secretName: linux-mcp-server-tls
