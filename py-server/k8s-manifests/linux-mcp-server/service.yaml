# Headless Service，为未来“基于 DNS 自动发现 linux-mcp-server Pod”预留。
# 当前版本暂不实现 DNS 自动发现，主 server 通过 MCP_ENDPOINTS 环境变量按节点 IP 访问。
# 该 Service 保留以便后续低优先级扩展，当前不影响现有功能。
apiVersion: v1
kind: Service
metadata:
  name: linux-mcp-server
  namespace: infrapilot-mcp
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: linux-mcp-server
  ports:
    - name: grpc
      port: 8443
      targetPort: 8443
