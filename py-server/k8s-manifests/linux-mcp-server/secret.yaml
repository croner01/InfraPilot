# 示例 Secret：生产环境请通过 Vault、Sealed Secrets 或 cert-manager 管理，
# 不要在此文件中提交真实密钥。
apiVersion: v1
kind: Secret
metadata:
  name: mcp-jwt-secret
  namespace: infrapilot-mcp
type: Opaque
stringData:
  secret: "change-this-to-a-random-secret-in-production"
---
