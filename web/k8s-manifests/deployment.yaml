apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-web
  namespace: infrapilot
  labels:
    app.kubernetes.io/name: infrapilot-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrapilot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrapilot-web
    spec:
      containers:
        - name: web
          image: infrapilot-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
