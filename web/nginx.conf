server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由刷新 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API / WebSocket 代理到后端 Service（通过环境变量或默认名解析）
    location /api/ {
        # 不加尾部斜杠：保留完整 /api/... 路径，避免剥掉前缀导致后端 404
        proxy_pass http://infrapilot-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # 关闭缓冲：SSE / 流式响应（如 a2a message/stream）才能实时下发，
        # 同时避免大响应被写入 proxy_temp 临时文件
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 诊断/修复类请求与长连接可能远超默认 60s，放宽超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 后端滚动重启（Deployment 为 Recreate）期间的瞬时失败允许重试
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /ws {
        proxy_pass http://infrapilot-server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
