apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-server
  namespace: infrapilot
  labels:
    app.kubernetes.io/name: infrapilot-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infrapilot-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrapilot-server
    spec:
      serviceAccountName: infrapilot-server
      containers:
        - name: server
          image: infrapilot-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: infrapilot-server-env
          env:
            - name: GSK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: infrapilot-server-secret
                  key: GSK_API_KEY
            - name: MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: infrapilot-server-secret
                  key: MCP_JWT_SECRET
            # 可选：注入 SSH 主机注册表
            # - name: SSH_HOSTS
            #   valueFrom:
            #     secretKeyRef:
            #       name: infrapilot-server-secret
            #       key: SSH_HOSTS
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 5
