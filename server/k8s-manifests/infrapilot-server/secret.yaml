apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-server-secret
  namespace: infrapilot
type: Opaque
stringData:
  # 必须替换为真实的 DeepSeek/Groq API Key
  GSK_API_KEY: "REPLACE_ME"
  # MCP 服务端与客户端共享的 JWT 签名密钥
  MCP_JWT_SECRET: "REPLACE_ME_WITH_STRONG_SECRET"
  # 可选：SSH 远程主机注册表（JSON 格式）
  # SSH_HOSTS: "[]"
