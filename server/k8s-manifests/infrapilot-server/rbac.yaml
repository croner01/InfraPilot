apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infrapilot-server
rules:
  # 读取 Pod/事件用于诊断
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # 读取并修改 Deployment 资源限制
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # 删除 Pod 以触发重建（可选，用于重置演示场景）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infrapilot-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infrapilot-server
subjects:
  - kind: ServiceAccount
    name: infrapilot-server
    namespace: infrapilot
