# 最小权限 RBAC：linux-mcp-server 仅需要读取节点信息用于展示节点身份，
# 不需要修改集群资源。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linux-mcp-server-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linux-mcp-server-reader
subjects:
  - kind: ServiceAccount
    name: linux-mcp-server
    namespace: infrapilot-mcp
roleRef:
  kind: ClusterRole
  name: linux-mcp-server-reader
  apiGroup: rbac.authorization.k8s.io
