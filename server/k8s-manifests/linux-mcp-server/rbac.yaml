# linux-mcp-server RBAC：允许在 DaemonSet 内通过 kubectl 执行只读诊断命令。
# 包括节点、Pod、Deployment 等常见资源以及 Pod 日志。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linux-mcp-server-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linux-mcp-server-reader
subjects:
  - kind: ServiceAccount
    name: linux-mcp-server
    namespace: infrapilot-mcp
roleRef:
  kind: ClusterRole
  name: linux-mcp-server-reader
  apiGroup: rbac.authorization.k8s.io
