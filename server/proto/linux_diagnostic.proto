syntax = "proto3";

package infrapilot.linux;

// ============================================================================
// Linux Diagnostic MCP Server — gRPC 接口定义
// 对应 InfraPilot Phase 2：常驻 Agent 提供结构化诊断能力
// ============================================================================

service LinuxDiagnostic {
  // 健康检查
  rpc Health(HealthRequest) returns (HealthResponse);

  // 只读诊断工具
  rpc GetCpuUsage(CpuRequest) returns (CpuResponse);
  rpc GetMemoryInfo(MemoryRequest) returns (MemoryResponse);
  rpc GetDiskUsage(DiskRequest) returns (DiskResponse);
  rpc GetNetworkStats(NetworkRequest) returns (NetworkResponse);
  rpc GetProcessInfo(ProcessRequest) returns (ProcessResponse);
  rpc TailSyslog(SyslogRequest) returns (SyslogResponse);

  // 通用只读命令执行（白名单控制，便于扩展 cat/less/kubectl 等运维命令）
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);

  // 变更类工具（需 Command Gateway 审批 + server 侧白名单）
  rpc RestartService(ServiceRequest) returns (ServiceResponse);
  rpc KillProcess(KillRequest) returns (KillResponse);
}

// ----------------------------------------------------------------------------
// 通用结构
// ----------------------------------------------------------------------------

message ProcessInfo {
  int32 pid = 1;
  string cmd = 2;
  double cpu_percent = 3;
  int64 rss_mb = 4;
}

// ----------------------------------------------------------------------------
// Health
// ----------------------------------------------------------------------------

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string version = 2;
}

// ----------------------------------------------------------------------------
// CPU
// ----------------------------------------------------------------------------

message CpuRequest {
  string host = 1;
  int32 top_n = 2;
}

message CpuResponse {
  bool success = 1;
  double usage_percent = 2;
  repeated ProcessInfo top_processes = 3;
  string error = 4;
  int32 duration_ms = 5;
}

// ----------------------------------------------------------------------------
// Memory
// ----------------------------------------------------------------------------

message MemoryRequest {
  string host = 1;
  int32 pid = 2;
}

message ProcessMemory {
  int32 pid = 1;
  int64 rss_mb = 2;
  int64 vm_size_mb = 3;
}

message MemoryResponse {
  bool success = 1;
  int64 total_mb = 2;
  int64 used_mb = 3;
  int64 available_mb = 4;
  string oom_history = 5;
  ProcessMemory process_detail = 6;
  string error = 7;
  int32 duration_ms = 8;
}

// ----------------------------------------------------------------------------
// Disk
// ----------------------------------------------------------------------------

message DiskRequest {
  string host = 1;
}

message DiskInfo {
  string filesystem = 1;
  int64 size_mb = 2;
  int64 used_mb = 3;
  int64 available_mb = 4;
  double use_percent = 5;
  string mounted_on = 6;
}

message DiskResponse {
  bool success = 1;
  repeated DiskInfo disks = 2;
  string error = 3;
  int32 duration_ms = 4;
}

// ----------------------------------------------------------------------------
// Network
// ----------------------------------------------------------------------------

message NetworkRequest {
  string host = 1;
  string iface = 2; // 可选，留空则返回所有接口汇总
}

message InterfaceStats {
  string name = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_errors = 4;
  int64 tx_errors = 5;
}

message NetworkResponse {
  bool success = 1;
  int32 total_connections = 2;
  int32 tcp_established = 3;
  int32 tcp_time_wait = 4;
  repeated InterfaceStats interfaces = 5;
  string error = 6;
  int32 duration_ms = 7;
}

// ----------------------------------------------------------------------------
// Process
// ----------------------------------------------------------------------------

message ProcessRequest {
  string host = 1;
  string name_pattern = 2;
}

message ProcessResponse {
  bool success = 1;
  repeated ProcessInfo processes = 2;
  string error = 3;
  int32 duration_ms = 4;
}

// ----------------------------------------------------------------------------
// Syslog
// ----------------------------------------------------------------------------

message SyslogRequest {
  string host = 1;
  int32 lines = 2;
}

message SyslogResponse {
  bool success = 1;
  repeated string lines = 2;
  string error = 3;
  int32 duration_ms = 4;
}

// ----------------------------------------------------------------------------
// Service restart (变更类)
// ----------------------------------------------------------------------------

message ServiceRequest {
  string host = 1;
  string service_name = 2;
}

message ServiceResponse {
  bool success = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
  string error = 5;
  int32 duration_ms = 6;
}

// ----------------------------------------------------------------------------
// Process kill (变更类)
// ----------------------------------------------------------------------------

message KillRequest {
  string host = 1;
  int32 pid = 2;
  string signal = 3; // 默认 SIGTERM；可选 HUP/USR1/USR2
}

message KillResponse {
  bool success = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
  string error = 5;
  int32 duration_ms = 6;
}

// ----------------------------------------------------------------------------
// Generic command runner (readonly + allowlist)
// ----------------------------------------------------------------------------

message RunCommandRequest {
  string host = 1;
  string command = 2;
  repeated string args = 3;
  int32 timeout_ms = 4; // 默认 10000ms
}

message RunCommandResponse {
  bool success = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
  string error = 5;
  int32 duration_ms = 6;
}
